# Lark application credentials and OpenAPI settings.
[lark]
app_id     = ""
app_secret = ""

# OpenAPI endpoints
# URL fields default to Lark Office endpoints when omitted.
# You can switch by (un)commenting the urls below.

# * Lark Office endpoints
base_url           = "https://open.larksuite.com/open-apis"
lark_authorize_url = "https://open.larksuite.com/open-apis/authen/v1/authorize"
lark_token_url     = "https://accounts.larksuite.com/oauth/v3/token"
lark_user_info_url = "https://open.larksuite.com/open-apis/authen/v1/user_info"

# * Feishu endpoints
# base_url           = "https://open.feishu.cn/open-apis"
# lark_authorize_url = "https://accounts.feishu.cn/open-apis/authen/v1/authorize"
# lark_token_url     = "https://accounts.feishu.cn/oauth/v3/token"
# lark_user_info_url = "https://open.feishu.cn/open-apis/authen/v1/user_info"

lark_scope = "contact:user.base:readonly"

# MCP listener and public URL.
[server]
# Local bind address and externally reachable origin for MCP and OAuth callbacks.
# Register http://127.0.0.1:3000/oauth/feishu/callback in Lark for local use.
listen = "127.0.0.1:3000"

# MCP OAuth discovery is enabled automatically at these URLs:
# - Protected resource metadata: "{public_base_url}/.well-known/oauth-protected-resource/mcp"
# - Authorization server metadata: "{public_base_url}/.well-known/oauth-authorization-server"
# - Authorization server base URL (issuer): "{public_base_url}"
# - Authorization URL: "{public_base_url}/authorize"
# - Token URL: "{public_base_url}/token"
# - Client registration URL: "{public_base_url}/register"
# - Resource URI: "{public_base_url}/mcp"; scope: "mcp:tools"
public_base_url = "http://127.0.0.1:3000"

# SQLite stores OAuth clients and hashed access and refresh token grants.
# The default is `.data/larkpush.sqlite` beside this config file.
# database_path = ".data/larkpush.sqlite"
