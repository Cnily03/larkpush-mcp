[package]
name = "larkpush-auth"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
larkpush-config = { path = "../config" }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
