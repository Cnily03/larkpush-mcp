[package]
name = "larkpush-worker"
version = "1.0.2"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
larkpush-auth = { path = "../crates/auth" }
larkpush-config = { path = "../crates/config" }
larkpush-dbapi = { path = "../crates/dbapi" }
async-trait = "0.1"
larkpush-lark = { path = "../crates/lark" }
larkpush-mcp = { path = "../crates/mcp" }
log = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-query = { version = "1.0.2", default-features = false, features = ["derive", "backend-sqlite", "thread-safe"] }
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["io-util", "sync"] }
url = "2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Crypto"] }
worker = { version = "0.8.5", default-features = false, features = ["d1"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
