[workspace]
members = ["crates/auth", "crates/config", "crates/lark", "crates/mcp"]
exclude = ["worker"]
resolver = "2"

[package]
name = "larkpush"
version = "1.0.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
larkpush-config = { path = "crates/config" }
larkpush-auth = { path = "crates/auth" }
larkpush-lark = { path = "crates/lark" }
larkpush-mcp = { path = "crates/mcp" }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-std", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

